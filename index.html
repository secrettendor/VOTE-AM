function handleCredentialResponse(response){
  const user = parseJwt(response.credential);
  const name = user.name || user.email;

  // Save login (simple flag lang)
  localStorage.setItem("loggedIn","1");

  showContent(name);
}

// JWT Decoder helper
function parseJwt(token){
  let base64Url = token.split('.')[1];
  let base64 = base64Url.replace(/-/g,'+').replace(/_/g,'/');
  let jsonPayload = decodeURIComponent(
    atob(base64).split('').map(c=>{
      return '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2);
    }).join('')
  );
  return JSON.parse(jsonPayload);
}

async function enter() {

  if (!validateEmail(email)) return alert("Invalid email!");

  try {
    // POST to backend API
    const res = await fetch("/api/record", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (data.success) {

      showContent(email);
    } else alert("Error recording login.");

}

// ------------------ EMAIL VALIDATION ------------------
function validateEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

  const now=new Date().toLocaleString();
  v.name=n; v.visits=(v.visits||0)+1; v.first=v.first||now; v.last=now;
  localStorage.setItem(k,JSON.stringify(v));
  console.log("VISIT LOG:",v);

  document.getElementById("login").style.display="none";
  document.getElementById("content").style.display="grid";

  const wm=document.getElementById("wm"); wm.innerHTML="";
  const stamp=`ASHDRES • ${n} • ${now} • visits:${v.visits}`;
  for(let i=0;i<24;i++){
    let d=document.createElement("div");
    d.textContent=stamp;
    wm.appendChild(d);
  }
  setInterval(()=>wm.style.transform=`rotate(${Math.random()*10-5}deg)`,3000);
}
